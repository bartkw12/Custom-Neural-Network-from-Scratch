[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "custom_nn"
version = "0.1.0"
description = "Custom Neural Network from scratch for Fashion MNIST classification"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "torch>=2.0",
    "torchvision>=0.15",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6", "build>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["custom_nn", "pytorch_nn"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E402"]
