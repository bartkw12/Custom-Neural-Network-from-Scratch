name: CI

on:
  push:
    branches:
      - main
      - develop
      - v2
  pull_request:
    branches:
      - main
      - v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]

      - name: Run pytest
        run: python -m pytest tests -q

  smoke-cli:
    name: CLI smoke checks (optional)
    runs-on: ubuntu-latest
    needs: tests
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]

      - name: CLI help smoke
        run: |
          python train.py --help
          python train.py custom --help
          python train.py pytorch --help
          python train.py compare --help
          python train.py analyze --help

      - name: Compare/analyze smoke (artifact-aware)
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "results/latest/custom/run_summary.json"
            "results/latest/custom/history.json"
            "results/latest/custom/best_checkpoint.npz"
            "results/latest/pytorch/run_summary.json"
            "results/latest/pytorch/history.json"
            "results/latest/pytorch/best_checkpoint.pt"
          )

          missing=0
          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Missing artifact: $file"
              missing=1
            fi
          done

          if [[ "$missing" -eq 1 ]]; then
            echo "Skipping compare/analyze smoke because required artifacts are not present in this checkout."
            exit 0
          fi

          python train.py compare

          # Normalize checkpoint paths in summaries for CI portability.
          # Local summaries can contain machine-specific absolute paths (e.g., I:\\... on Windows).
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path.cwd()
          custom_summary = root / "results/latest/custom/run_summary.json"
          pytorch_summary = root / "results/latest/pytorch/run_summary.json"

          custom_out = root / "results/latest/custom/run_summary.ci.json"
          pytorch_out = root / "results/latest/pytorch/run_summary.ci.json"

          with custom_summary.open("r", encoding="utf-8") as handle:
              custom = json.load(handle)
          with pytorch_summary.open("r", encoding="utf-8") as handle:
              pytorch = json.load(handle)

          custom["checkpoints"]["latest"] = str(root / "results/latest/custom/best_checkpoint.npz")
          custom["checkpoints"]["archive"] = str(root / "results/latest/custom/best_checkpoint.npz")

          pytorch["checkpoints"]["latest"] = str(root / "results/latest/pytorch/best_checkpoint.pt")
          pytorch["checkpoints"]["archive"] = str(root / "results/latest/pytorch/best_checkpoint.pt")

          with custom_out.open("w", encoding="utf-8") as handle:
              json.dump(custom, handle, indent=2)
          with pytorch_out.open("w", encoding="utf-8") as handle:
              json.dump(pytorch, handle, indent=2)
          PY

          python train.py analyze \
            --custom-summary results/latest/custom/run_summary.ci.json \
            --pytorch-summary results/latest/pytorch/run_summary.ci.json \
            --sample-count 9 \
            --sample-seed 9782
